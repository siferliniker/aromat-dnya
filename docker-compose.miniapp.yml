name: aromatia-miniapp

services:
  app:
    image: aromatia-miniapp:local
    build: .
    command: ["python", "-m", "miniapp"]
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/aromat.db
    ports:
      - "127.0.0.1:8765:8000"
    volumes:
      - aromat_data:/data
      - type: bind
        source: ${AROMAT_ENV_FILE:-./.env}
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

volumes:
  aromat_data:
    external: true
    name: aromat-dnya_aromat_data
