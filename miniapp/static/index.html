<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f2ea" />
    <title>Ароматия — найдите своё звучание</title>
    <link rel="icon" href="/static/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/app.css" />
    <script src="https://telegram.org/js/telegram-web-app.js?65"></script>
    <script src="/static/ru.js" defer></script>
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="header">
        <a class="brand" href="/" aria-label="Ароматия, подбор ароматов"
          ><img src="/static/mark.svg" width="24" height="28" alt="" /><span
            >АРОМАТИЯ</span
          ></a
        >
        <span class="sr-only" id="header-note">Личное знакомство с ароматами</span>
        <div class="header-actions">
          <button type="button" id="undo-reaction" class="icon-button" aria-label="Отменить последнюю реакцию" title="Отменить последнюю реакцию" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4 3 9l5 5M3 9h10a7 7 0 0 1 0 14" transform="translate(0 -3)"/></svg></button>
          <button type="button" id="open-details" class="icon-button" aria-label="Об аромате и источниках" title="Об аромате и источниках"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/></svg></button>
          <button type="button" id="open-catalog" class="icon-button" aria-label="Поиск ароматов" title="Поиск ароматов" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <section class="message-panel initial-loading" aria-live="polite">
          <span class="loading-leaf"></span>
          <p>Готовим ваше следующее знакомство…</p>
        </section>
      </main>
    </div>
    <nav class="bottom-nav" aria-label="Основное меню">
      <div class="nav-inner">
        <button
          type="button"
          class="nav-item active"
          data-tab="discover"
          aria-label="Подбор"
          title="Подбор"
          aria-current="page"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="m12 3 2.1 6.9L21 12l-6.9 2.1L12 21l-2.1-6.9L3 12l6.9-2.1L12 3Z"
            /></svg
          ><span class="sr-only">Подбор</span>
        </button>
        <button type="button" class="nav-item" data-tab="wishlist" aria-label="Избранное" title="Избранное">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20.8 4.7a5.5 5.5 0 0 0-7.8 0l-1 1-1-1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.5a5.5 5.5 0 0 0 0-7.8Z"
            /></svg
          ><span class="sr-only">Избранное <small id="wishlist-count"></small></span>
        </button>
        <button type="button" class="nav-item" data-tab="known" aria-label="Коллекция" title="Коллекция">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 8h10v13H7zM9 3h6v5H9zM7 12h10" /></svg
          ><span class="sr-only">Коллекция <small id="known-count"></small></span>
        </button>
      </div>
    </nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog id="catalog-dialog" aria-labelledby="catalog-title">
      <button type="button" class="close-dialog" aria-label="Закрыть поиск">×</button>
      <header class="catalog-head"><h1 id="catalog-title" class="library-title">Каталог</h1></header>
      <form id="catalog-form" class="catalog-filters" role="search">
        <label class="sr-only" for="catalog-query">Название или бренд</label>
        <input id="catalog-query" type="search" maxlength="120" placeholder="Например, Acqua di Parma" autocomplete="off" />
        <button type="button" id="catalog-filter-toggle" class="icon-button" aria-label="Фильтры" title="Фильтры"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="16" cy="17" r="3"/></svg></button>
      </form>
      <p id="catalog-status" class="catalog-status" role="status" aria-live="polite"></p>
      <div id="catalog-results"></div>
      <div id="catalog-pager" class="page-controls"></div>
    </dialog>
    <dialog id="filters-dialog" aria-labelledby="filters-title">
      <button type="button" class="close-dialog" aria-label="Закрыть фильтры">×</button>
      <h1 id="filters-title" class="library-title">Фильтры</h1>
      <div class="filter-grid">
          <label>Семейство<select id="catalog-family"><option value="">Все семейства</option></select></label>
          <label>Сезон<select id="catalog-season"><option value="">Любой сезон</option></select></label>
          <label>Время<select id="catalog-time"><option value="">В любое время</option></select></label>
          <label class="note-filter">Нота<select id="catalog-note"><option value="">Любая нота</option></select></label>
      </div>
      <button type="button" class="text-button" id="catalog-reset">Сбросить фильтры</button>
    </dialog>
    <dialog id="details-dialog" aria-label="Подробности об аромате">
      <button type="button" class="close-dialog" aria-label="Закрыть">×</button>
      <div id="details-content"></div>
    </dialog>
  </body>
</html>
